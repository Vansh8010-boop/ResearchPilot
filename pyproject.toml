[project]
name = "research-pilot"
version = "0.1.0"
description = "Plan-and-execute research agent with web search, page retrieval and calculator tools"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "anthropic>=1.0",
    "httpx>=0.27",
    "python-dotenv>=1.0",
    "trafilatura>=2.0",
]

[project.optional-dependencies]
api = ["fastapi>=0.115", "uvicorn>=0.30"]
ui = ["streamlit>=1.40"]

[project.scripts]
rp = "research_pilot.cli:main"

[dependency-groups]
dev = ["pytest>=8", "fastapi>=0.115"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/research_pilot"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]  # so tests can import the bench/ scripts
