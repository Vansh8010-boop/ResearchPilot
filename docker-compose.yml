services:
  api:
    build: .
    command: ["uvicorn", "research_pilot.api:app", "--host", "0.0.0.0", "--port", "8000"]
    env_file: .env  # model and search keys live only in the API container
    ports:
      - "8000:8000"
    volumes:
      - data:/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 5

  ui:
    build: .
    command: ["streamlit", "run", "ui/app.py", "--server.address", "0.0.0.0", "--server.port", "8501"]
    environment:
      RP_API_URL: http://api:8000
      RP_API_TOKEN: ${RP_API_TOKEN:-}
    ports:
      - "8501:8501"
    depends_on:
      api:
        condition: service_healthy

volumes:
  data:
